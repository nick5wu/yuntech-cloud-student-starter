# W9：HTTPS 入口（TLS 1.2/1.3），轉給只聽 127.0.0.1:8080 的服務。
# 憑證由 deploy/w09_tls.py 在本機產生並由 deploy/w09_up.py 放到 /etc/inspection/tls/。
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate     /etc/inspection/tls/server.crt;
    ssl_certificate_key /etc/inspection/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache off;
    client_max_body_size 2m;            # 照片上限 1MB，應用程式端另行檢查
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_request_buffering on;
    }
}
